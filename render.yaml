services:
  # 1. FastAPI REST API Service
  - type: web
    name: lumenreview-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./data/lumenreview.db
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: GEMINI_API_KEY
        sync: false

  # 2. Streamlit UI Service
  - type: web
    name: lumenreview-ui
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run ui/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: lumenreview-api
          property: host
      - key: LLM_PROVIDER
        value: mock
